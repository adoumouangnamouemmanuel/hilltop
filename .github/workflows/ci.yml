name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    # Applies the migrations and seed to a fresh local Supabase, then checks the
    # security rules, the schema linter and Supabase's advisors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase db start
      - run: supabase test db
      - run: supabase db lint --level warning --fail-on warning
      - run: supabase db advisors --local --fail-on warn

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Tests sign in for real against a local Supabase, reading codes from its Mailpit.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase start -x realtime,studio,imgproxy,edge-runtime,logflare,vector,storage-api,postgres-meta,supavisor
      - name: Point the build at the local Supabase
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "MAILPIT_URL=$MAILPIT_URL" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w @hilltop/web
      - run: npm run test:e2e -w @hilltop/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  deploy:
    # Ships main to Cloudflare once checks and end-to-end tests pass.
    runs-on: ubuntu-latest
    needs: [checks, e2e, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Skipped (not failed) until the CLOUDFLARE_API_TOKEN secret is added to the repo.
      - name: Deploy admin
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy -w @hilltop/admin
      - name: Deploy marketplace
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy -w @hilltop/web
