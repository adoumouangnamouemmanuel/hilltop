name: CI

on:
  push:
  pull_request:

# Jobs only read the repository unless they say otherwise.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (the tag is in the comment), so a moved tag can't
# change what runs here. Dependabot or Renovate keeps them current.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Runtime dependencies with high or critical advisories fail the build; moderate
      # ones in build tooling are tracked in docs/RUNBOOK.md.
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    # Fails if a credential is committed anywhere in the history being pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database:
    # Applies the migrations and seed to a fresh local Supabase, then checks the
    # security rules, the schema linter and Supabase's advisors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3.1.0
        with:
          version: 2.122.0
      - run: supabase db start
      - run: supabase test db
      - run: supabase db lint --level warning --fail-on warning
      - run: supabase db advisors --local --fail-on warn

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Tests sign in for real against a local Supabase, reading codes from its Mailpit.
      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3.1.0
        with:
          version: 2.122.0
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,storage-api,postgres-meta,supavisor
      - name: Point the build at the local Supabase
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "MAILPIT_URL=$MAILPIT_URL" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w @hilltop/web
      - run: npm run test:e2e -w @hilltop/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  deploy:
    # Ships main to Cloudflare once checks and end-to-end tests pass. The "production"
    # environment holds the Cloudflare token and can require a reviewer's approval
    # (Settings → Environments). The token is only given to the two deploy steps, so
    # dependency install scripts and the build never see it.
    runs-on: ubuntu-latest
    needs: [checks, e2e, database, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      # Only whether the token exists, not the token itself.
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build admin
        working-directory: apps/admin
        run: npx opennextjs-cloudflare build
      - name: Build marketplace
        working-directory: apps/web
        run: npx opennextjs-cloudflare build
      # Skipped (not failed) until the CLOUDFLARE_API_TOKEN secret is added to the environment.
      - name: Deploy admin
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        working-directory: apps/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
      - name: Deploy marketplace
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
