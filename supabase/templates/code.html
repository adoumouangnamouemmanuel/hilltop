<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f6f4f2;font-family:Poppins,Segoe UI,Helvetica,Arial,sans-serif;color:#1c1918">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f4f2;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;padding:32px">
            <tr>
              <td>
                <p style="margin:0 0 24px;font-size:18px;font-weight:600;letter-spacing:-0.02em;color:#761d27">hilltop</p>
                <p style="margin:0 0 8px;font-size:20px;font-weight:600;letter-spacing:-0.02em;color:#121010">Your sign-in code</p>
                <p style="margin:0 0 24px;font-size:14px;line-height:22px;color:#6f6a67">Enter this code to continue. It expires in 10 minutes.</p>
                <p style="margin:0 0 24px;padding:16px;border-radius:12px;background:#f6f4f2;text-align:center;font-size:32px;font-weight:600;letter-spacing:8px;color:#121010">{{ .Token }}</p>
                <p style="margin:0;font-size:12px;line-height:18px;color:#736d69">If you didn't ask for this, you can ignore this email. Nobody can sign in without the code.</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;color:#736d69">Hilltop, the Ashesi student marketplace</p>
        </td>
      </tr>
    </table>
  </body>
</html>
